<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - +Forte</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --verde-escuro: #0f381e;
            --verde-principal: #1f6b3a;
            --verde-suave: #2d8a4e;
            --verde-claro: #eaf5ee;
            --fundo: #f8faf9;
            --card-fundo: #ffffff;
            --texto-primario: #1a231e;
            --texto-secundario: #5a6e62;
            --borda-suave: #e2e9e4;
            --vermelho: #e53935;
            --azul: #1976d2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--fundo);
            color: var(--texto-primario);
            padding: 20px;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            display: none; /* Oculto até logar */
        }

        /* Tela de Login */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 56, 30, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: var(--card-fundo);
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid var(--borda-suave);
            text-align: center;
        }

        .login-card h2 {
            color: var(--verde-escuro);
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .login-card p {
            color: var(--texto-secundario);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-admin h1 {
            color: var(--verde-escuro);
            font-size: 1.5rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-back, .btn-logout {
            background: var(--card-fundo);
            border: 1px solid var(--borda-suave);
            padding: 10px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--texto-primario);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-logout {
            color: var(--vermelho);
            border-color: #ffe0e0;
            background: #fff5f5;
        }

        .admin-card {
            background: var(--card-fundo);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px -5px rgba(15, 56, 30, 0.05);
            border: 1px solid var(--borda-suave);
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--texto-secundario);
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--borda-suave);
            font-size: 0.95rem;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }
        .form-row input, 
        .form-row select {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .btn-submit {
            background: var(--verde-principal);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--verde-suave);
        }

        .btn-cancel-edit {
            background: #757575;
            margin-top: 8px;
            display: none;
        }

        .product-item-admin {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px;
            background: var(--card-fundo);
            border-radius: 14px;
            border: 1px solid var(--borda-suave);
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .product-admin-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-admin-info img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
        }

        .admin-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-status {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-status.disponivel { background: #e8f5e9; color: var(--verde-principal); }
        .btn-status.esgotado { background: #ffebee; color: var(--vermelho); }

        .btn-edit {
            background: #e3f2fd;
            color: var(--azul);
            border: 1px solid #bbdefb;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-delete {
            background: #fff5f5;
            color: var(--vermelho);
            border: 1px solid #ffe0e0;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border-radius: 10px;
            border: 1px solid var(--borda-suave);
            font-size: 0.95rem;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--texto-secundario);
        }
    </style>
</head>
<body>

    <!-- Tela de Login Bonita -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <h2>Área Restrita</h2>
            <p>Digite a senha para gerenciar a loja</p>
            <form id="loginForm" onsubmit="fazerLogin(event)">
                <div class="form-group">
                    <label>Senha de Acesso</label>
                    <input type="password" id="senhaInput" required placeholder="••••">
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
                <a href="index.html" style="display: block; margin-top: 16px; color: var(--texto-secundario); text-decoration: none; font-size: 0.85rem;"><i class="fa-solid fa-arrow-left"></i> Voltar ao catálogo</a>
            </form>
        </div>
    </div>

    <!-- Conteúdo do Painel Admin -->
    <div class="admin-container" id="adminContainer">
        <div class="header-admin">
            <h1>Gerenciar Produtos</h1>
            <div class="header-actions">
                <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
                <button onclick="logoutAdmin()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
            </div>
        </div>

        <div class="admin-card">
            <h2 id="formTitle" style="margin-bottom: 16px; font-size: 1.1rem; color: var(--verde-escuro);">Novo Produto</h2>
            <form id="productForm">
                <input type="hidden" id="editingId">
                
                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input type="text" id="pName" required placeholder="Ex: Castanha do Pará">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo de Venda</label>
                        <select id="pType">
                            <option value="granel">A Granel (Gramas)</option>
                            <option value="unidade">Unidade / Embalagem</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Preço (R$)</label>
                        <input type="number" step="0.01" id="pPrice" required placeholder="0.00">
                    </div>
                </div>

                <div class="form-group">
                    <label>URL ou Caminho da Imagem</label>
                    <input type="text" id="pImg" placeholder="img/produto.jpg ou https://link.com/foto.jpg">
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="pDesc" rows="2" placeholder="Breve descrição do produto..."></textarea>
                </div>

                <button type="submit" id="btnSubmitForm" class="btn-submit"><i class="fa-solid fa-plus"></i> Cadastrar Produto</button>
                <button type="button" id="btnCancelEdit" class="btn-submit btn-cancel-edit" onclick="resetForm()"><i class="fa-solid fa-xmark"></i> Cancelar Edição</button>
            </form>
        </div>

        <div class="admin-card">
            <h2 style="margin-bottom: 16px; font-size: 1.1rem; color: var(--verde-escuro);">Produtos Cadastrados</h2>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchProduct" placeholder="Pesquisar produto pelo nome..." oninput="filterProducts()">
            </div>

            <div id="adminProductList">
                <!-- Lista gerenciável via Firebase -->
            </div>
        </div>
    </div>

    <script>
        const SENHA_CORRETA = "1234";

        // Verifica autenticação ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('adminAuth') === 'true') {
                liberarAcesso();
            }
        });

        function fazerLogin(e) {
            e.preventDefault();
            const senhaDigitada = document.getElementById('senhaInput').value;

            if (senhaDigitada === SENHA_CORRETA) {
                localStorage.setItem('adminAuth', 'true');
                liberarAcesso();
            } else {
                alert("Senha incorreta!");
                document.getElementById('senhaInput').value = '';
            }
        }

        function liberarAcesso() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
        }

        function logoutAdmin() {
            localStorage.removeItem('adminAuth');
            window.location.reload();
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCSvYqpPZjai6azGS8nKASK4cnAwJah2So",
            authDomain: "forte-catalogo.firebaseapp.com",
            databaseURL: "https://forte-catalogo-default-rtdb.firebaseio.com",
            projectId: "forte-catalogo",
            storageBucket: "forte-catalogo.firebasestorage.app",
            messagingSenderId: "1035353045692",
            appId: "1:1035353045692:web:0cd960192d2172ad7aaeb9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const form = document.getElementById('productForm');
        const adminProductList = document.getElementById('adminProductList');
        
        let allProductsData = {};

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const editingId = document.getElementById('editingId').value;
            
            const prodData = {
                name: document.getElementById('pName').value,
                type: document.getElementById('pType').value,
                price: parseFloat(document.getElementById('pPrice').value),
                img: document.getElementById('pImg').value || 'https://via.placeholder.com/100?text=Produto',
                desc: document.getElementById('pDesc').value,
                status: 'disponivel'
            };

            if (editingId) {
                const currentStatus = allProductsData[editingId] ? allProductsData[editingId].status : 'disponivel';
                prodData.status = currentStatus;

                db.ref(`products/${editingId}`).update(prodData, (err) => {
                    if (!err) {
                        alert("Produto atualizado com sucesso!");
                        resetForm();
                    } else {
                        alert("Erro ao atualizar: " + err.message);
                    }
                });
            } else {
                db.ref('products').push(prodData, (err) => {
                    if (!err) {
                        form.reset();
                        alert("Produto cadastrado com sucesso!");
                    } else {
                        alert("Erro ao cadastrar: " + err.message);
                    }
                });
            }
        });

        db.ref('products').on('value', (snapshot) => {
            allProductsData = snapshot.val() || {};
            renderProductList(allProductsData);
        });

        function renderProductList(data) {
            adminProductList.innerHTML = '';

            if (!data || Object.keys(data).length === 0) {
                adminProductList.innerHTML = '<p style="color: var(--texto-secundario); text-align: center;">Nenhum produto cadastrado no banco.</p>';
                return;
            }

            Object.keys(data).forEach(id => {
                const p = data[id];
                const isEsgotado = p.status === 'esgotado';

                adminProductList.innerHTML += `
                    <div class="product-item-admin product-row" data-name="${p.name.toLowerCase()}">
                        <div class="product-admin-info">
                            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/48?text=Item'">
                            <div>
                                <h4 style="font-size: 0.95rem;">${p.name}</h4>
                                <span style="font-size: 0.8rem; color: var(--texto-secundario);">${p.type === 'granel' ? 'A granel' : 'Unidade'} - R$ ${p.price.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="admin-actions">
                            <button class="btn-status ${isEsgotado ? 'esgotado' : 'disponivel'}" onclick="toggleStatus('${id}', '${p.status || 'disponivel'}')">
                                ${isEsgotado ? 'Esgotado' : 'Disponível'}
                            </button>
                            <button class="btn-edit" onclick="prepareEdit('${id}')" title="Editar produto">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn-delete" onclick="deleteProduct('${id}')" title="Excluir produto">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const term = document.getElementById('searchProduct').value.toLowerCase();
            const rows = document.querySelectorAll('.product-row');

            rows.forEach(row => {
                const name = row.getAttribute('data-name');
                if (name.includes(term)) {
                    row.style.display = 'flex';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        function prepareEdit(id) {
            const p = allProductsData[id];
            if (!p) return;

            document.getElementById('editingId').value = id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pType').value = p.type;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pImg').value = p.img;
            document.getElementById('pDesc').value = p.desc || '';

            document.getElementById('formTitle').innerText = 'Editar Produto';
            document.getElementById('btnSubmitForm').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Salvar Alterações';
            document.getElementById('btnCancelEdit').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            form.reset();
            document.getElementById('editingId').value = '';
            document.getElementById('formTitle').innerText = 'Novo Produto';
            document.getElementById('btnSubmitForm').innerHTML = '<i class="fa-solid fa-plus"></i> Cadastrar Produto';
            document.getElementById('btnCancelEdit').style.display = 'none';
        }

        function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'esgotado' ? 'disponivel' : 'esgotado';
            db.ref(`products/${id}`).update({ status: newStatus });
        }

        function deleteProduct(id) {
            if (confirm("Tem certeza que deseja excluir este produto?")) {
                db.ref(`products/${id}`).remove();
            }
        }
    </script>
</body>
</html>
