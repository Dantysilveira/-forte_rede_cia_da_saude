<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>+Forte - Cia da Saúde</title>
    
    <!-- Fonte Inter & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --verde-escuro: #0f381e;
            --verde-principal: #1f6b3a;
            --verde-suave: #2d8a4e;
            --verde-claro: #eaf5ee;
            --fundo: #f8faf9;
            --card-fundo: #ffffff;
            --texto-primario: #1a231e;
            --texto-secundario: #5a6e62;
            --borda-suave: #e2e9e4;
            --sombra-card: 0 10px 30px -5px rgba(15, 56, 30, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
            --sombra-hover: 0 20px 35px -10px rgba(15, 56, 30, 0.12);
            --vermelho: #e53935;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--fundo);
            color: var(--texto-primario);
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* HEADER COM FUNDO DE FOLHAS */
        .header {
            background:linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), 
                url('img/fundo.jpeg') center/cover no-repeat !important;
            background-position: center !important;
            background-size: cover !important;
            color: white;
            padding: 50px 20px 70px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .menu-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }

        .menu-icon:hover { transform: scale(1.05); }

        .brand-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .main-title {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .sub-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #8be3a2;
            margin-top: 6px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7) !important;
        }

        /* AÇÕES RÁPIDAS */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 0 20px;
            max-width: 560px;
            margin: -24px auto 28px;
            position: relative;
            z-index: 10;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--card-fundo);
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--texto-primario);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--sombra-card);
            border: 1px solid var(--borda-suave);
            transition: all 0.25s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: var(--sombra-hover);
        }

        /* CATEGORIAS EM CÍRCULO */
        .categories-section {
            max-width: 560px;
            margin: 0 auto 32px;
            padding: 0 20px;
        }

        .categories-section .section-title {
            margin-bottom: 20px;
        }

        .categories-grid {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            gap: 16px;
        }

        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            width: 100px;
            text-align: center;
            transition: transform 0.25s ease;
        }

        .category-card:hover {
            transform: translateY(-4px);
        }

        .category-icon-box {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 2px solid transparent;
            transition: all 0.25s ease;
            margin-bottom: 10px;
        }

        .category-icon-box i {
            font-size: 1.8rem;
            color: var(--verde-principal);
            transition: color 0.25s ease;
        }

        .category-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--texto-primario);
            line-height: 1.25;
        }

        .category-card.active .category-icon-box {
            background: var(--verde-principal);
            border-color: var(--verde-escuro);
            box-shadow: 0 10px 22px rgba(31, 107, 58, 0.35);
        }

        .category-card.active .category-icon-box i {
            color: #ffffff;
        }

        .category-card.active .category-label {
            color: var(--verde-escuro);
            font-weight: 700;
        }

        /* CONTAINER PRINCIPAL */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--verde-escuro);
            letter-spacing: -0.2px;
        }

        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* PRODUTOS */
        .product-card {
            background: var(--card-fundo);
            border-radius: 20px;
            padding: 18px;
            box-shadow: var(--sombra-card);
            border: 1px solid var(--borda-suave);
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            box-shadow: var(--sombra-hover);
            border-color: #d0ded5;
        }

        .product-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .product-img {
            width: 72px;
            height: 72px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            background-color: var(--verde-claro);
            border: 1px solid #e1ebe4;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--texto-primario);
            margin-bottom: 4px;
        }

        .product-info p {
            font-size: 0.82rem;
            color: var(--texto-secundario);
            line-height: 1.35;
        }

        .qty-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f4f7f5;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid #e8eee9;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--texto-secundario);
        }

        .qty-btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-qty {
            background: white;
            border: 1px solid var(--borda-suave);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--verde-escuro);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-qty:hover {
            background: var(--verde-claro);
            border-color: var(--verde-suave);
            color: var(--verde-principal);
        }

        .qty-display {
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 55px;
            text-align: center;
            color: var(--texto-primario);
        }

        .btn-add {
            background: var(--verde-principal);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(31, 107, 58, 0.2);
        }

        .btn-add:hover {
            background: var(--verde-escuro);
            transform: translateY(-1px);
        }

        /* BARRA DE CARRINHO */
        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(15, 56, 30, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 520px;
            margin: 0 auto;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .cart-summary {
            font-size: 0.92rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-badge {
            background: #25d366;
            color: var(--verde-escuro);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 800;
        }

        .btn-whatsapp {
            background: #25d366;
            color: var(--verde-escuro);
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-whatsapp:hover {
            background: #20bd5a;
            transform: scale(1.02);
        }

        /* MODAL CARRINHO */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 30, 20, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.25s cubic-bezier(0, 0, 0.2, 1);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--borda-suave);
        }

        .modal-header h3 {
            color: var(--verde-escuro);
            font-size: 1.2rem;
            font-weight: 700;
        }

        .btn-close-modal {
            background: #f4f7f5;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            color: var(--texto-secundario);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-items-list {
            overflow-y: auto;
            max-height: 48vh;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f8faf9;
            border-radius: 14px;
            border: 1px solid var(--borda-suave);
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .cart-item-info img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
        }

        .cart-item-details h4 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--texto-primario);
        }

        .cart-item-details span {
            font-size: 0.82rem;
            color: var(--verde-principal);
            font-weight: 700;
        }

        .btn-remove-item {
            background: none;
            border: none;
            color: var(--vermelho);
            cursor: pointer;
            padding: 6px;
            font-size: 0.95rem;
            opacity: 0.7;
        }

        .btn-remove-item:hover { opacity: 1; }

        .cart-footer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--borda-suave);
        }

        .btn-clear-cart {
            background: #fff5f5;
            color: var(--vermelho);
            border: 1px solid #ffe0e0;
            padding: 11px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-modal {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-yes { background: #25d366; color: var(--verde-escuro); }
        
        @media (min-width: 768px) {
            .container, .categories-section, .quick-actions { max-width: 960px; }
            .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .cart-bar { max-width: 600px; }
        }

<body>

    <!-- HEADER -->
    <header class="header">
        <button class="menu-icon" onclick="window.location.href='admin.html'" title="Painel Admin">
            <i class="fa-solid fa-lock" style="color: var(--verde-escuro);"></i>
        </button>
        <h1 class="brand-title">
            <span class="main-title">+ FORTE</span>
            <span class="sub-title">REDE CIA DA SAÚDE</span>
        </h1>
        <p style="margin-top: 10px;">Cuidando da sua saúde com qualidade 💚</p>
    </header>

    <!-- AÇÕES RÁPIDAS -->
    <div class="quick-actions">
        <a href="https://www.google.com/maps/dir/Lauro+Muller+-+Lauro+M%C3%BCller,+SC,+88880-000/Cia+da+Sa%C3%BAde,+R.+Dr.+Valdir+Cotrim,+21+-+sala+01+CEP+89.295-115+-+Centro,+Lauro+M%C3%BCller+-+SC,+88880-000/@-28.3936244,-49.397673,17.42z/data=!4m13!4m12!1m5!1m1!1s0x9521a6f97528f5af:0x20788d1b6abebe89!2m2!1d-49.3960234!2d-28.3919751!1m5!1m1!1s0x9521a7198b8001b1:0xac13dfb4d97e156b!2m2!1d-49.3972127!2d-28.3949525?entry=ttu&g_ep=EgoyMDI2MDgxOS4wIKXMDSoASAFQAw%3D%3D"

    <!-- LISTA DE PRODUTOS -->
    <div class="container">

    <!-- MODAL DO CARRINHO -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-card" id="modalContent"></div>
    </div>

    <script>
        const initialProducts = [
            {
                id: "1",
                name: "Castanha do Pará Extra",
                type: "granel",
                price: 12.00,
                img: "img/castanhadopara.jpeg",
                desc: "Rica em selênio e gorduras boas (A granel - a partir de 100g)"
            },
            {
                id: "2",
                name: "Whey Protein Concentrado 900g",
                type: "unidade",
                price: 120.00,
                img: "img/wheyconcentrado.jpeg",
                desc: "Suplementação proteica de alta qualidade"
            },
            {
                id: "3",
                name: "Chá Verde Orgânico",
                type: "granel",
                price: 8.50,
                img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=200&q=80",
                desc: "Antioxidante e termogênico natural (A granel - a partir de 100g)"
            },
            {
                id: "4",
                name: "Creatina Monohidratada 300g",
                type: "unidade",
                price: 95.00,
                img: "img/252-0831-001_zoom1.jpeg",
                desc: "Aumento de força e resistência muscular"
            }
        ];

        const firebaseConfig = {
            apiKey: "AIzaSyCSvYqpPZjai6azGS8nKASK4cnAwJah2So",
            authDomain: "forte-catalogo.firebaseapp.com",
            databaseURL: "https://forte-catalogo-default-rtdb.firebaseio.com",
            projectId: "forte-catalogo",
            storageBucket: "forte-catalogo.firebasestorage.app",
            messagingSenderId: "1035353045692",
            appId: "1:1035353045692:web:0cd960192d2172ad7aaeb9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let rawProductsData = {};
        let currentActiveCategory = null;
        let cart = {};
        let currentSelections = {};

        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && Object.keys(data).length > 0) {
                rawProductsData = data;
            } else {
                rawProductsData = {};
                initialProducts.forEach(p => { rawProductsData[p.id] = p; });
            }
            loadProducts(currentActiveCategory);
        }, (error) => {
            console.error("Erro no Firebase, usando produtos locais:", error);
            rawProductsData = {};
            initialProducts.forEach(p => { rawProductsData[p.id] = p; });
            loadProducts(currentActiveCategory);
        });

        function loadProducts(categoryFilter = null) {
            currentActiveCategory = categoryFilter;
            const grid = document.getElementById('productList');
            grid.innerHTML = '';

            if (!categoryFilter) {
               if (!categoryFilter) {
            grid.innerHTML = `
                <div id="welcome-message" class="welcome-banner">
                    <div class="welcome-badge">💚 ALIMENTAÇÃO SAUDÁVEL</div>                    
                    <h2>Que bom ter você por aqui! 👋</h2>
                    <p>Selecione uma das categorias acima para explorar nossos produtos naturais, grãos e suplementos.</p>
                    <div class="welcome-features">
                        <span>✨ Produtos Frescos</span>
                        <span>⚡ Entrega Rápida</span>
                        <span>💬 Pedido via WhatsApp</span>
                    </div>
                </div>
            `;
            return;
               }
                return;
            }

            const productListArray = Object.keys(rawProductsData).map(k => {
                return { ...rawProductsData[k], keyId: k };
            });

            const filtered = productListArray.filter(p => {
                const pName = p.name ? p.name.toLowerCase() : '';
                if (categoryFilter === 'graos') return p.type === 'granel';
                if (categoryFilter === 'suplementos') return p.type === 'unidade' && !pName.includes('chá');
                if (categoryFilter === 'chas') return pName.includes('chá');
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="text-align:center; padding: 20px; color: var(--texto-secundario);">Nenhum produto encontrado nesta categoria.</p>`;
                return;
            }

            filtered.forEach(p => {
                const prodId = p.keyId || p.id;
                const isGranel = p.type === 'granel';
                const isEsgotado = p.status === 'esgotado';
                
                if (!currentSelections[prodId]) {
                    currentSelections[prodId] = isGranel ? 100 : 1;
                }
                const currentQty = currentSelections[prodId];

                grid.innerHTML += `
                    <div class="product-card" style="${isEsgotado ? 'opacity: 0.7;' : ''}">
                        <div class="product-header">
                            <div class="product-img">
                                <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/100?text=Produto'">
                            </div>
                            <div class="product-info">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <h3>${p.name}</h3>
                                    ${isEsgotado ? '<span style="background: #ffebee; color: #e53935; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;">Esgotado</span>' : ''}
                                </div>
                                <p>${p.desc || ''}</p>
                            </div>
                        </div>

                        <div class="qty-control" style="${isEsgotado ? 'pointer-events: none; opacity: 0.5;' : ''}">
                            <span>${isGranel ? 'Quantidade (g):' : 'Unidades:'}</span>
                            <div class="qty-btn-group">
                                <button class="btn-qty" onclick="changeQty('${prodId}', -1)">-</button>
                                <span class="qty-display" id="qty-display-${prodId}">
                                    ${isGranel ? currentQty + 'g' : currentQty}
                                </span>
                                <button class="btn-qty" onclick="changeQty('${prodId}', 1)">+</button>
                            </div>
                        </div>

                        ${isEsgotado ? `
                            <button class="btn-add" style="background: #ccc; cursor: not-allowed;" disabled>
                                <i class="fa-solid fa-ban"></i> Indisponível no Momento
                            </button>
                        ` : `
                            <button class="btn-add" onclick="addToCart('${prodId}')">
                                <i class="fa-solid fa-cart-plus"></i> Adicionar ao Pedido
                            </button>
                        `}
                    </div>
                `;
            });
        }

        function changeQty(id, direction) {
            const product = rawProductsData[id] || Object.values(rawProductsData).find(p => p.id == id);
            if (!product) return;

            const isGranel = product.type === 'granel';

            if (isGranel) {
                let newGrams = (currentSelections[id] || 100) + (direction * 100);
                if (newGrams < 100) newGrams = 100;
                currentSelections[id] = newGrams;
                const displayEl = document.getElementById(`qty-display-${id}`);
                if (displayEl) displayEl.innerText = newGrams + 'g';
            } else {
                let newQty = (currentSelections[id] || 1) + direction;
                if (newQty < 1) newQty = 1;
                currentSelections[id] = newQty;
                const displayEl = document.getElementById(`qty-display-${id}`);
                if (displayEl) displayEl.innerText = newQty;
            }
        }

        function addToCart(id) {
            const product = rawProductsData[id] || Object.values(rawProductsData).find(p => p.id == id);
            if (!product) return;

            const qtyToAdd = currentSelections[id] || (product.type === 'granel' ? 100 : 1);

            cart[id] = { ...product, id: id, qty: qtyToAdd };
            updateCartSummary();

            const defaultQty = product.type === 'granel' ? 100 : 1;
            currentSelections[id] = defaultQty;
            
            const displayEl = document.getElementById(`qty-display-${id}`);
            if (displayEl) {
                displayEl.innerText = product.type === 'granel' ? defaultQty + 'g' : defaultQty;
            }

            alert(`${product.name} adicionado ao pedido (${product.type === 'granel' ? qtyToAdd + 'g' : qtyToAdd + ' un'})!`);
        }

        function updateCartSummary() {
            let totalItemsCount = 0;
            Object.values(cart).forEach(item => {
                if (item.type === 'granel') {
                    totalItemsCount += 1;
                } else {
                    totalItemsCount += item.qty;
                }
            });
            document.getElementById('cartCount').innerText = totalItemsCount;
        }

        function filterCategory(cat, element) {
            document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
            if (element) element.classList.add('active');
            loadProducts(cat);
        }

        function renderCartModal() {
            const content = document.getElementById('modalContent');
            const cartKeys = Object.keys(cart);

            if (cartKeys.length === 0) {
                content.innerHTML = `
                    <div class="modal-header">
                        <h3>Meu Pedido</h3>
                        <button class="btn-close-modal" onclick="closeCartModal()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div style="text-align: center; padding: 30px 0;">
                        <i class="fa-solid fa-basket-shopping" style="font-size: 3rem; color: #ccc; margin-bottom: 12px;"></i>
                        <p style="color: var(--texto-secundario);">Seu carrinho está vazio.</p>
                    </div>
                `;
                return;
            }

            let itemsHtml = '';
            Object.values(cart).forEach(item => {
                const isGranel = item.type === 'granel';
                const qtyText = isGranel ? `${item.qty}g` : `${item.qty} un`;

                itemsHtml += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/44?text=Item'">
                            <div class="cart-item-details">
                                <h4>${item.name}</h4>
                                <span>${qtyText}</span>
                            </div>
                        </div>
                        <button class="btn-remove-item" onclick="removeFromCart('${item.id}')" title="Remover item">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });

            content.innerHTML = `
                <div class="modal-header">
                    <h3>Meu Pedido</h3>
                    <button class="btn-close-modal" onclick="closeCartModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="cart-items-list">
                    ${itemsHtml}
                </div>
                <div class="cart-footer">
                    <button class="btn-clear-cart" onclick="clearCart()">
                        <i class="fa-solid fa-trash"></i> Limpar Carrinho
                    </button>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-modal btn-yes" onclick="sendToWhatsApp()">
                            <i class="fa-brands fa-whatsapp"></i> Enviar Pedido
                        </button>
                    </div>
                </div>
            `;
        }

        function openCartModal() {
            renderCartModal();
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function removeFromCart(id) {
            delete cart[id];
            updateCartSummary();
            renderCartModal();
        }

        function clearCart() {
            cart = {};
            updateCartSummary();
            renderCartModal();
        }

       function sendToWhatsApp() {
    const items = Object.values(cart);
    if (items.length === 0) return;

    let text = "Olá! Gostaria de fazer o seguinte pedido:\n\n";
    let totalGeral = 0;

    items.forEach(item => {
        let itemTotal = 0;
        let qtyText = '';

        if (item.type === 'granel') {
            // Se o preço cadastrado é por cada 100g:
            itemTotal = (item.price * item.qty) / 100;
            
            // OBS: Se o seu preço cadastrado for por 1kg (1000g), troque o / 100 acima por / 1000
            
            qtyText = `${item.qty}g`;
        } else {
            // Unidade normal
            itemTotal = item.price * item.qty;
            qtyText = `${item.qty} un`;
        }

        totalGeral += itemTotal;

        const itemTotalFormatted = itemTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        text += `• *${item.name}* - ${qtyText} (${itemTotalFormatted})\n`;
    });

    const totalGeralFormatted = totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    text += `\n*Total do Pedido:* ${totalGeralFormatted}`;

    const phone = "5548988399195";
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
}

        document.addEventListener('DOMContentLoaded', () => {
            const categoryCards = document.querySelectorAll('.category-card');
            const welcomeMessage = document.getElementById('welcome-message');
            const productCards = document.querySelectorAll('.product-card');

            // Função para resetar a tela ao estado inicial
            const resetToInitialState = () => {
                // 1. Remove a seleção das categorias
                categoryCards.forEach(c => c.classList.remove('active'));

                // 2. Exibe a mensagem de boas-vindas
                if (welcomeMessage) {
                    welcomeMessage.style.display = 'block';
                }

                // 3. Exibe todos os produtos novamente (estado inicial padrão)
                productCards.forEach(product => {
                    product.style.display = 'flex'; // ou 'block', dependendo do seu CSS
                });
            };

            // 1. Clique nas categorias
            categoryCards.forEach(card => {
                card.addEventListener('click', (event) => {
                    event.stopPropagation();

                    categoryCards.forEach(c => c.classList.remove('active'));
                    card.classList.add('active');

                    if (welcomeMessage) {
                        welcomeMessage.style.display = 'none';
                    }

                    // A sua lógica de filtrar produtos continua sendo executada pela sua função principal
                });
            });

            // 2. Clique fora das categorias ou produtos
            document.addEventListener('click', (event) => {
                const isClickInsideCategory = event.target.closest('.categories-section');
                const isClickInsideProduct = event.target.closest('.product-card');

                if (!isClickInsideCategory && !isClickInsideProduct) {
                    resetToInitialState();
                }
            });
        });
    </script>
</body>
</html>
